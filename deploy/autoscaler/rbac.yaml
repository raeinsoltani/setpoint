# Least-privilege access for the autoscaler.
#
# The permission set is deliberately the same one Kubernetes' own HPA needs:
# read a Deployment, read and write its scale subresource. Notably absent is any
# verb on pods or on the Deployment spec itself, so a compromised autoscaler can
# change how *many* replicas run but not *what* they run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prom-autoscaler
  namespace: default
  labels:
    app.kubernetes.io/name: prom-autoscaler
---
# A Role, not a ClusterRole: the autoscaler scales one Deployment in one
# namespace, so namespace scope is sufficient and cluster-wide scale permission
# would be unjustified.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prom-autoscaler
  namespace: default
  labels:
    app.kubernetes.io/name: prom-autoscaler
rules:
  # Reading the Deployment supplies .status.readyReplicas, which the scale
  # subresource does not expose and which the scaling formula uses as its base.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
  # Scaling events are the audit trail for what the autoscaler did and when.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prom-autoscaler
  namespace: default
  labels:
    app.kubernetes.io/name: prom-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prom-autoscaler
subjects:
  - kind: ServiceAccount
    name: prom-autoscaler
    namespace: default
