apiVersion: apps/v1
kind: Deployment
metadata:
  name: setpoint
  namespace: default
  labels:
    app.kubernetes.io/name: setpoint
spec:
  # Exactly one. Two autoscalers on the same Deployment would each observe the
  # other's scaling as a load change and fight; leader election would be the
  # alternative, and is unjustified for a single-target controller.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: setpoint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setpoint
        app: setpoint
    spec:
      serviceAccountName: setpoint
      # SIGTERM is handled, and the loop exits between reconciles, so this only
      # ever has to cover one in-flight API call.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setpoint
          image: setpoint:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/setpoint/config.yaml
            - --log-level=info
          ports:
            - name: metrics
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /etc/setpoint
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: setpoint-config
---
apiVersion: v1
kind: Service
metadata:
  name: setpoint
  namespace: default
  labels:
    app.kubernetes.io/name: setpoint
    app: setpoint
spec:
  selector:
    app.kubernetes.io/name: setpoint
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
