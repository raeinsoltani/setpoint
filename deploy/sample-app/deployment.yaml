# The workload under test. Named `sample` in namespace `default` to match
# scaler.deployment in config.yaml and deploy/setpoint/configmap.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: default
  labels:
    app: sample
spec:
  # Starts at 1 so every experiment begins from the same state: the autoscaler's
  # job is to find the right number, and seeding it near the answer would flatter
  # every arm equally but hide reaction time, which is metric one in the proposal.
  replicas: 1
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      # Spread replicas across nodes where there are nodes to spread across. On the
      # single-node dev cluster this is a no-op; on kind with workers it stops all
      # ten replicas landing on one kubelet and contending for the same CPU, which
      # would corrupt the latency figures.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sample
      containers:
        - name: sample-app
          image: sample-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # 2ms of CPU per request x 100 req/s target = 200m, which is exactly
            # the CPU request below. See the calibration note in cmd/sample-app.
            - name: WORK_CPU_MS
              value: "2"
            - name: WORK_SLEEP_MS
              value: "0"
            # Bound in-flight work so /healthz and /metrics stay answerable under
            # any offered load. Without this the pod goes dark under overload and
            # the autoscaler loses the signal it needs — see work() in
            # cmd/sample-app/main.go.
            - name: WORK_MAX_CONCURRENT
              value: "16"
          resources:
            requests:
              cpu: 200m
              memory: 32Mi
            limits:
              # 5x the request, deliberately generous, and the reason matters.
              #
              # At 400m the CFS quota is 40ms per 100ms period, so under sustained
              # overload the container is frozen for 60% of wall-clock time. It then
              # cannot answer /healthz within a probe timeout or /metrics within a
              # scrape timeout, however fast it sheds work — and once the scrape
              # fails, rate(http_requests_total) goes stale, the autoscaler reads an
              # empty result as zero load, and the fleet never grows. Observed live
              # on 2026-07-30: stuck at 1 replica through an entire 1300 req/s spike.
              #
              # This costs nothing in comparison fairness: HPA's utilization maths
              # uses the CPU *request*, not the limit, so the calibration that makes
              # hpa-cpu and ours-threshold aim at the same setpoint is untouched. The
              # limit only decides how gracefully a replica degrades while it waits
              # for company.
              #
              # 20 replicas request 4 of the node's 14 CPU; limits oversubscribe, as
              # limits are meant to.
              cpu: 1000m
              memory: 64Mi
          # Readiness is what the autoscaler's formula base counts, so this probe
          # decides when a new replica starts "counting". Kept quick, because a slow
          # probe is indistinguishable from slow pod startup and would contaminate
          # the startup-latency sweep in Phase 7.2 — but not so tight that a busy
          # replica is declared unready, which would drop readyReplicas to zero and
          # leave the policy with no formula base.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          # A liveness probe must detect a *deadlocked* process, never a slow one.
          # With timeoutSeconds 1 this probe failed under a 1300 req/s spike and
          # kubelet restarted the container three times, which made the overload
          # worse and destroyed the metric history the autoscaler was reading.
          # Restarting a busy process is almost never the right response; these
          # numbers tolerate ~90s of unresponsiveness before concluding the process
          # is genuinely stuck.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: default
  labels:
    # This label is promoted onto every scraped series by the ServiceMonitor's
    # targetLabels, which is what makes `http_requests_total{app="sample"}` and
    # `up{app="sample"}` in the autoscaler's PromQL resolve. Removing it silently
    # empties the query and the autoscaler reads zero load.
    app: sample
spec:
  # LoadBalancer, not ClusterIP, and this is not cosmetic.
  #
  # `kubectl port-forward svc/sample` forwards to a *single pod* — it resolves one
  # endpoint and holds it. Driving load that way caps every experiment at one
  # replica's capacity (~200 req/s here), so the fleet would scale up and the
  # offered load would not follow, and every arm would look identical because none
  # of them was ever actually loaded. A LoadBalancer service goes through kube-proxy
  # and balances across all ready endpoints, which is the behaviour the evaluation
  # needs.
  #
  # Docker Desktop and kind both surface LoadBalancer services on localhost, so
  # `k6 run` needs no port-forward at all: http://localhost:8080.
  type: LoadBalancer
  selector:
    app: sample
  ports:
    - name: http
      port: 8080
      targetPort: http
