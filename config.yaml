# Local development configuration: Prometheus reached through
# `kubectl port-forward`, target Deployment reached through the ambient kubeconfig.
#
# The in-cluster equivalent lives in deploy/setpoint/configmap.yaml. Schema is
# identical to sim/config.yaml so the prototype and this autoscaler are always
# configured the same way.

interval_seconds: 15          # reconcile period, matching HPA's sync period

collector:
  type: prometheus            # prometheus | static
  url: http://localhost:9090
  timeout_seconds: 5
  # The scaling signal: requests/second per ready replica. clamp_min guards the
  # window between the Deployment existing and any pod reporting up, where the
  # denominator would otherwise be zero.
  query: >
    sum(rate(http_requests_total{app="sample"}[1m]))
      / clamp_min(count(up{app="sample"} == 1), 1)

policy:
  name: predictive            # threshold | predictive | predictive-per-replica
  target: 100.0               # desired per-replica value of the signal
  tolerance: 0.10             # 10% dead-band, as in Kubernetes HPA
  min_replicas: 1
  # 20, not 10, and matching MAX_R in sim/demo/simulate.py.
  #
  # Every workload in test/load/ peaks at 1200-1300 req/s, which needs 12-13
  # replicas at a target of 100. A ceiling of 10 would clip the fleet during peak on
  # all four patterns, so every comparison arm would saturate at 10 replicas serving
  # 130 req/s each — identically above the SLA line — and the SLA-violation metric
  # would stop distinguishing the arms exactly where the comparison matters most.
  # Predictive would appear no better than reactive for a reason that has nothing to
  # do with either policy.
  #
  # Capacity is not the constraint: 20 replicas request 4 CPU of the node's 14, and
  # 20 of its 110 pod slots.
  max_replicas: 20
  forecaster:
    type: ewma                # ewma | holt
    horizon: 3                # steps ahead; 3 x 15s = 45s of lead time
    alpha: 0.5                # EWMA smoothing factor
  stabilization_window_seconds: 90   # anti-flapping downscale window
  cooldown_seconds: 0         # minimum gap between scale actions; 0 disables
  max_step: 0                 # cap on replicas changed per decision; 0 disables

scaler:
  type: kubernetes            # kubernetes | inmemory
  deployment: sample
  namespace: default
  # kubeconfig: /path/to/kubeconfig   # omit for in-cluster / default config

exporter:
  enabled: true
  port: 8000                  # serves /metrics and /healthz
